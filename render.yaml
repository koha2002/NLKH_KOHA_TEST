services:
  # Frontend gốc NLKH_KOHA - GIỮ NGUYÊN Next.js static export, không có Web Service ngủ đông.
  - type: web
    name: nguyen-le-khanh-hoa
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_ADMIN_URL
        sync: false

  # Admin tách riêng - cũng là Static Site.
  - type: web
    name: nlkh-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_ADMIN_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
