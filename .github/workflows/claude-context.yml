name: Build Claude context
on:
  push:
    branches: [admin-v4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-context
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/export-claude-context.mjs
      - name: Publish to branch claude-context
        working-directory: claude-context
        run: |
          git init -q -b claude-context
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "context from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" claude-context