name: Backend scheduler

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run due jobs
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "x-scheduler-secret: ${SCHEDULER_SECRET}" \
            "${SITE_BASE_URL%/}/api/cron/schedule-runner"
